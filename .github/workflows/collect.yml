name: Collect news and deploy

on:
  schedule:
    - cron: "*/30 * * * *"
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch news feeds
        run: node scripts/fetch-news.mjs

      # The collected news.json is never committed, so pushing to master cannot
      # carry it to Cloudflare — the built directory is uploaded directly.
      # Cloudflare is the only host now: the GitHub Pages deploy was removed so
      # one stale copy of the app cannot keep serving from a second origin.
      - name: Deploy to Cloudflare Pages
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: |
          npx --yes wrangler@4 pages deploy site \
            --project-name=news-feeder \
            --branch=master \
            --commit-dirty=true
