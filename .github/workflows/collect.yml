name: Collect news and deploy

on:
  schedule:
    - cron: "*/30 * * * *"
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch news feeds
        run: node scripts/fetch-news.mjs

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # The collected news.json is never committed, so pushing to master cannot
      # carry it to Cloudflare — the built directory is uploaded directly. The
      # step is skipped until the secrets exist, and a Cloudflare failure must
      # not fail a run whose GitHub Pages deploy already succeeded.
      - name: Deploy to Cloudflare Pages
        if: env.CLOUDFLARE_API_TOKEN != ''
        continue-on-error: true
        run: |
          npx --yes wrangler@4 pages deploy site \
            --project-name=news-feeder \
            --branch=master \
            --commit-dirty=true
