name: Deploy to Cloudflare Pages

# Collection moved to the Cloudflare cron Worker, which writes the feed to KV
# and sweeps the trackers on the same schedule. GitHub is the source of truth
# for code and nothing else, so this runs on a push rather than on a clock.
#
# The collector still runs once here: site/data/news.json ships in the deploy as
# the fallback the app reads before the Worker's first run of a new deployment,
# and if KV is ever unreachable. It is not the live feed.

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # A stale fallback is better than none, so a failure here does not block
      # the deploy — the Worker supplies the live feed either way.
      - name: Build the fallback feed
        continue-on-error: true
        run: node scripts/fetch-news.mjs

      - name: Deploy to Cloudflare Pages
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: |
          npx --yes wrangler@4 pages deploy site \
            --project-name=news-feeder \
            --branch=master \
            --commit-dirty=true
