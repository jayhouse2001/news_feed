name = "news-feeder-cron"
main = "cron.js"
compatibility_date = "2026-08-01"

# Every half hour, the cadence the feed collection has always run at.
[triggers]
crons = ["*/30 * * * *"]

# Same database the Pages Functions bind as DB.
[[d1_databases]]
binding = "DB"
database_name = "news-feeder"
database_id = "f40060f0-afd0-42f3-86f6-86198e1522bd"

# Holds the collected feed as one blob. The Pages project binds the same
# namespace under the same name, since /api/news reads what this Worker writes.
[[kv_namespaces]]
binding = "NEWS"
id = "3ac943558c2a438b8834e949a26ebc07"
