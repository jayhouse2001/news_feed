name = "news-feeder-cron"
main = "cron.js"
compatibility_date = "2026-08-01"

# Every half hour, the cadence the feed collection has always run at.
[triggers]
crons = ["*/30 * * * *"]

# Same database the Pages Functions bind as DB.
[[d1_databases]]
binding = "DB"
database_name = "news-feeder"
database_id = "f40060f0-afd0-42f3-86f6-86198e1522bd"

# Holds the collected feed as one blob. Filled in after
# `wrangler kv namespace create NEWS` — see SERVER.md.
[[kv_namespaces]]
binding = "NEWS"
id = "REPLACE_WITH_KV_ID"
