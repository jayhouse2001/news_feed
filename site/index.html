<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>뉴스 피드</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="appbar">
    <h1 id="appbar-title">뉴스</h1>
    <span id="updated-at" class="updated"></span>
  </header>

  <main>
    <section id="view-dashboard" class="view" hidden>
      <p class="placeholder">대시보드 위젯은 준비 중입니다. (M5)</p>
    </section>

    <section id="view-news" class="view">
      <nav id="cats" class="cats" aria-label="카테고리"></nav>
      <ul id="news-list" class="news-list"></ul>
      <p id="news-empty" class="placeholder" hidden>기사를 불러오지 못했습니다.</p>
    </section>

    <section id="view-settings" class="view" hidden>
      <p class="placeholder">설정은 준비 중입니다. (M3~M4)</p>
    </section>
  </main>

  <nav class="tabbar" aria-label="주 메뉴">
    <button class="tab" data-view="dashboard" data-title="대시보드">▦<span>대시보드</span></button>
    <button class="tab on" data-view="news" data-title="뉴스">📰<span>뉴스</span></button>
    <button class="tab" data-view="settings" data-title="설정">⚙<span>설정</span></button>
  </nav>

  <script src="js/app.js"></script>
</body>
</html>
