<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>뉴스 피드</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#2e5fcc">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="뉴스">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="appbar">
    <h1 id="page-title">대시보드</h1>
    <button id="refresh-btn" class="icon-btn" aria-label="뉴스 새로고침" title="최신 뉴스로 업데이트">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M20 12a8 8 0 1 1-2.34-5.66" fill="none" stroke="currentColor"
              stroke-width="2.2" stroke-linecap="round"/>
        <path d="M20 4v5h-5" fill="none" stroke="currentColor"
              stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
    <div class="appbar-right">
      <span id="updated-at" class="updated"></span>
      <button id="settings-btn" class="icon-btn" aria-label="설정">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="3.1" fill="none" stroke="currentColor" stroke-width="2"/>
          <path d="M12 3.5v2.2M12 18.3v2.2M4.4 8.1l1.9 1.1M17.7 14.8l1.9 1.1M4.4 15.9l1.9-1.1M17.7 9.2l1.9-1.1"
                fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </button>
    </div>
  </header>

  <nav id="pagedots" class="pagedots" aria-label="페이지"></nav>

  <div id="pager" class="pager"></div>

  <div id="overlay-root" hidden></div>

  <script src="js/app.js"></script>
</body>
</html>
