<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>뉴스 피드</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#2e5fcc">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="뉴스">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="appbar">
    <h1 id="page-title">대시보드</h1>
    <button id="refresh-btn" class="icon-btn" aria-label="뉴스 새로고침" title="최신 뉴스로 업데이트">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M20 12a8 8 0 1 1-2.34-5.66" fill="none" stroke="currentColor"
              stroke-width="2.2" stroke-linecap="round"/>
        <path d="M20 4v5h-5" fill="none" stroke="currentColor"
              stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
    <div class="appbar-right">
      <span id="updated-at" class="updated"></span>
      <button id="share-btn" class="icon-btn" aria-label="이 앱 주소 공유" title="주소 공유">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 3v13M12 3 8 7M12 3l4 4" fill="none" stroke="currentColor"
                stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M5 12v7a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-7" fill="none"
                stroke="currentColor" stroke-width="2.1" stroke-linecap="round"/>
        </svg>
      </button>
      <button id="settings-btn" class="icon-btn" aria-label="설정">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path fill="currentColor" d="M19.14 12.94a7.5 7.5 0 0 0 .06-.94 7.5 7.5 0 0 0-.06-.94l2.03-1.58a.5.5 0 0 0 .12-.64l-1.92-3.32a.5.5 0 0 0-.6-.22l-2.39.96a7.3 7.3 0 0 0-1.63-.94l-.36-2.54a.5.5 0 0 0-.5-.42h-3.84a.5.5 0 0 0-.49.42l-.36 2.54c-.59.24-1.13.56-1.63.94l-2.39-.96a.5.5 0 0 0-.6.22L2.65 8.84a.5.5 0 0 0 .12.64l2.03 1.58c-.04.31-.6.62-.6.94s.2.63.06.94L2.83 14.5a.5.5 0 0 0-.12.64l1.92 3.32c.13.22.39.31.6.22l2.39-.96c.5.38 1.04.7 1.63.94l.36 2.54c.4.24.25.42.49.42h3.84c.25 0 .46-.18.5-.42l.36-2.54c.59-.24 1.13-.56 1.63-.94l2.39.96c.22.09.47 0 .6-.22l1.92-3.32a.5.5 0 0 0-.12-.64l-2.03-1.56ZM12 15.5A3.5 3.5 0 1 1 15.5 12 3.5 3.5 0 0 1 12 15.5Z"/>
        </svg>
      </button>
    </div>
  </header>

  <nav id="pagedots" class="pagedots" aria-label="카테고리"></nav>

  <div id="pager" class="pager"></div>

  <nav id="tabbar" class="tabbar" aria-label="섹션"></nav>

  <div id="overlay-root" hidden></div>

  <script src="js/app.js"></script>
</body>
</html>
